<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="832" viewBox="0 0 1280 832" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrMpi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="832" fill="#ffffff"/>

  <!-- Host -->
  <rect x="20" y="20" width="1240" height="792" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="50" font-size="18" font-weight="bold" fill="#334155">Host</text>
  <text x="92" y="50" font-size="15" fill="#64748b">macOS (Apple silicon / Intel)  or  Windows + WSL2</text>

  <!-- Container runtime -->
  <rect x="200" y="70" width="1040" height="722" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="220" y="98" font-size="16" font-weight="bold" fill="#334155">Container runtime (Docker / Podman)  ·  slurm-docker-cluster</text>
  <text x="220" y="120" font-size="14" fill="#64748b">image: Rocky Linux 9 + Slurm 26.05.5 + OpenPMIx 4.1.3 + Open MPI 4.1.8</text>

  <!-- mysql -->
  <rect x="240" y="145" width="220" height="125" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="260" y="175" font-size="19" font-weight="bold" fill="#4c1d95">mysql</text>
  <text x="260" y="197" font-size="14" fill="#5b21b6">Accounting database</text>
  <rect x="260" y="212" width="180" height="30" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="350" y="232" font-size="13.5" fill="#4c1d95" text-anchor="middle">MySQL server</text>

  <!-- slurmdbd -->
  <rect x="520" y="145" width="260" height="125" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="175" font-size="19" font-weight="bold" fill="#1e3a8a">slurmdbd</text>
  <text x="540" y="197" font-size="14" fill="#1e40af">Slurm database daemon</text>
  <rect x="540" y="212" width="220" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="650" y="232" font-size="13.5" fill="#1e3a8a" text-anchor="middle">slurmdbd · slurmdbd.conf</text>

  <!-- slurmctld -->
  <rect x="860" y="145" width="350" height="125" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="880" y="175" font-size="19" font-weight="bold" fill="#1e3a8a">slurmctld</text>
  <text x="880" y="197" font-size="14" fill="#1e40af">Slurm controller</text>
  <rect x="880" y="212" width="100" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="930" y="232" font-size="13.5" fill="#1e3a8a" text-anchor="middle">slurmctld</text>
  <rect x="990" y="212" width="200" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1090" y="232" font-size="13.5" fill="#1e3a8a" text-anchor="middle">slurm.conf · cgroup.conf</text>

  <!-- control-plane arrows -->
  <line x1="856" y1="207" x2="784" y2="207" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="820" y="197" font-size="12" fill="#475569" text-anchor="middle">6819</text>
  <line x1="516" y1="207" x2="464" y2="207" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="490" y="197" font-size="12" fill="#475569" text-anchor="middle">3306</text>

  <!-- User -->
  <circle cx="95" cy="408" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <path d="M65,462 Q95,424 125,462 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="486" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">User</text>
  <line x1="130" y1="440" x2="236" y2="440" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="95" y="512" font-size="12.5" fill="#475569" text-anchor="middle">docker exec -it</text>
  <text x="95" y="529" font-size="12.5" fill="#475569" text-anchor="middle">login bash</text>

  <!-- login -->
  <rect x="240" y="380" width="290" height="170" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="260" y="410" font-size="19" font-weight="bold" fill="#1e293b">login</text>
  <text x="260" y="432" font-size="14" fill="#334155">Login node / job submission</text>
  <g font-size="13.5" fill="#1e293b">
    <rect x="260" y="446" width="250" height="28" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="385" y="465" text-anchor="middle">sbatch · srun · salloc</text>
    <rect x="260" y="480" width="250" height="28" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="385" y="499" text-anchor="middle">sinfo · squeue · sacct</text>
    <rect x="260" y="514" width="250" height="28" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="385" y="533" text-anchor="middle">mpicc (Open MPI)</text>
  </g>

  <!-- login -> slurmctld -->
  <line x1="500" y1="376" x2="868" y2="274" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="640" y="316" font-size="12" fill="#475569" text-anchor="middle">jobs (6817)</text>

  <!-- slurmctld <-> compute -->
  <line x1="960" y1="274" x2="770" y2="376" stroke="#4b5563" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="1095" y1="274" x2="1095" y2="376" stroke="#4b5563" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1000" y="320" font-size="12" fill="#475569" text-anchor="middle">6817 / 6818</text>

  <!-- c1 -->
  <rect x="570" y="380" width="290" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="410" font-size="19" font-weight="bold" fill="#14532d">c1</text>
  <text x="590" y="432" font-size="14" fill="#166534">Compute node #1</text>
  <g font-size="13.5" fill="#14532d">
    <rect x="590" y="446" width="250" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="715" y="465" text-anchor="middle">slurmd</text>
    <rect x="590" y="480" width="250" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="715" y="499" text-anchor="middle">Open MPI 4.1.8</text>
    <rect x="590" y="514" width="250" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="715" y="533" text-anchor="middle">OpenPMIx 4.1.3</text>
  </g>

  <!-- c2 -->
  <rect x="920" y="380" width="290" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="940" y="410" font-size="19" font-weight="bold" fill="#14532d">c2</text>
  <text x="940" y="432" font-size="14" fill="#166534">Compute node #2</text>
  <g font-size="13.5" fill="#14532d">
    <rect x="940" y="446" width="250" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="1065" y="465" text-anchor="middle">slurmd</text>
    <rect x="940" y="480" width="250" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="1065" y="499" text-anchor="middle">Open MPI 4.1.8</text>
    <rect x="940" y="514" width="250" height="28" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="1065" y="533" text-anchor="middle">OpenPMIx 4.1.3</text>
  </g>

  <!-- MPI -->
  <line x1="864" y1="494" x2="916" y2="494" stroke="#b45309" stroke-width="2" marker-start="url(#arrMpi)" marker-end="url(#arrMpi)"/>
  <text x="890" y="482" font-size="13" fill="#b45309" text-anchor="middle">MPI</text>
  <text x="890" y="520" font-size="11.5" fill="#b45309" text-anchor="middle">PMIx</text>

  <!-- storage -->
  <text x="1210" y="582" font-size="12" fill="#64748b" text-anchor="end">shared storage  ·  mounted on</text>
  <rect x="240" y="592" width="970" height="46" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="260" y="621" font-size="15" font-weight="bold" fill="#713f12">/data</text>
  <text x="315" y="621" font-size="14" fill="#713f12">shared volume  ·  job working directory shared by the nodes</text>
  <text x="1194" y="621" font-size="12" fill="#a16207" text-anchor="end">slurmctld, login, c1 and c2</text>

  <rect x="240" y="654" width="970" height="46" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="260" y="683" font-size="15" font-weight="bold" fill="#155e75">/home</text>
  <text x="318" y="683" font-size="14" fill="#155e75">shared volume  ·  users' home directories, like an NFS home</text>
  <text x="1194" y="683" font-size="12" fill="#0e7490" text-anchor="end">login, c1 and c2</text>

  <rect x="240" y="716" width="970" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="260" y="745" font-size="15" font-weight="bold" fill="#7c2d12">/shared</text>
  <text x="332" y="745" font-size="14" fill="#7c2d12">bind mount of ./shared on the host  ·  file exchange with the host</text>

    <text x="1194" y="745" font-size="12" fill="#c2410c" text-anchor="end">all containers</text>

  <!-- host ./shared folder -->
  <path d="M48,714 h34 l8,9 h48 v42 h-90 z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="93" y="786" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">./shared</text>
  <line x1="140" y1="742" x2="236" y2="740" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
</svg>
